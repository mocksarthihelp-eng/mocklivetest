<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live Support | Admin Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); height: 100vh; color: white; overflow: hidden; }

    /* ===== LOGIN SCREEN ===== */
    #loginScreen {
        position: fixed; top:0; left:0; width:100%; height:100%;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); z-index: 100;
    }
    .login-box {
        background: #1e293b; padding: 2.2rem 2rem; border-radius: 14px; width: 320px;
        text-align: center; box-shadow: 0 20px 45px rgba(0,0,0,0.5); border: 1px solid #334155;
    }
    .login-box i.fa-headset { font-size: 2.6rem; color: #25D366; margin-bottom: 10px; }
    .login-box h2 { font-size: 1.3rem; margin-bottom: 6px; }
    .login-box p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 14px; background: #334155; border: none; border-radius: 8px; color: white; outline: none; }
    .login-box button { width: 100%; padding: 12px; background: linear-gradient(145deg, #25D366, #1ebe57); border: none; border-radius: 8px; color: white; font-weight: 800; cursor: pointer; transition: 0.2s; }
    .login-box button:hover { transform: translateY(-2px); }
    .login-error { color: #ef4444; font-size: 0.82rem; margin-top: 10px; display: none; }

    /* ===== DASHBOARD WORKSPACE ===== */
    #dashboard { display: none; height: 100vh; padding: 1rem; flex-direction: column; max-width: 1200px; margin: 0 auto; }
    .dash-header { display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); padding: 1rem 1.5rem; border-radius: 10px; border-left: 6px solid #25D366; margin-bottom: 1rem; flex-shrink: 0; }
    .dash-header h1 { font-size: 1.2rem; display:flex; align-items:center; gap:10px; }
    
    .workspace { display: flex; gap: 15px; flex: 1; min-height: 0; }
    
    /* SIDEBAR: KEYS LIST */
    .sidebar { width: 300px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; border: 1px solid #334155; flex-shrink: 0; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid #334155; text-align: center; }
    .generate-btn { width: 100%; background: #25D366; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .generate-btn:hover { background: #1ebe57; }
    #keysList { flex: 1; overflow-y: auto; padding: 10px; }
    .key-item { background: #334155; padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #94a3b8; transition: 0.2s; }
    .key-item:hover { background: #475569; color: white; }
    .key-item.active { background: #075E54; color: white; border-left: 4px solid #25D366; }
    
    /* CHAT AREA */
    .chat-area { flex: 1; background: #0f172a; border-radius: 12px; display: flex; flex-direction: column; border: 1px solid #334155; position: relative; }
    .chat-header { background: #1e293b; padding: 15px; border-bottom: 1px solid #334155; border-radius: 12px 12px 0 0; display: flex; flex-direction: column; gap: 5px; }
    .chat-header-title { font-weight: bold; display: flex; justify-content: space-between; }
    .chat-status-bar { font-size: 0.8rem; font-weight: 600; min-height: 15px; }
    .status-online { color: #25D366; }
    .status-offline { color: #94a3b8; }
    .status-typing { color: #3b82f6; font-style: italic; }
    
    #chatMessages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; position: relative; }
    .msg-admin { background: #075E54; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
    .msg-student { background: #334155; color: white; align-self: flex-start; border-bottom-left-radius: 0; }
    .msg-time { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 0.65rem; color: #cbd5e1; margin-top: 4px; }
    
    .chat-input-box { display: flex; gap: 10px; padding: 15px; background: #1e293b; border-top: 1px solid #334155; border-radius: 0 0 12px 12px; }
    .chat-input-box input { flex: 1; background: #334155; border: none; padding: 12px 15px; border-radius: 25px; color: white; outline: none; }
    .chat-input-box button { background: #25D366; border: none; width: 45px; height: 45px; border-radius: 50%; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    
    .empty-chat { flex:1; display:flex; align-items:center; justify-content:center; color: #94a3b8; flex-direction: column; gap: 15px; }
    .empty-chat i { font-size: 3rem; opacity: 0.5; }
</style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <i class="fas fa-headset"></i>
        <h2>Live Support</h2>
        <p>Admin Dashboard — sirf Ankush ke liye</p>
        <input type="password" id="adminPassInput" placeholder="Password" autocomplete="off">
        <button id="adminLoginBtn">Login</button>
        <div class="login-error" id="loginErrorMsg">Galat password! Dobara try karo.</div>
    </div>
</div>

<div id="dashboard">
    <div class="dash-header">
        <h1><i class="fas fa-headset"></i> Support Desk (Admin)</h1>
        <button id="logoutBtn" style="background:#334155; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="workspace">
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="generate-btn" id="generateKeyBtn"><i class="fas fa-key"></i> Generate 6-Digit Key</button>
            </div>
            <div id="keysList"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <div class="chat-header-title"><span><i class="fas fa-comments"></i> Select a key to start chat</span></div>
                <div class="chat-status-bar" id="studentStatus"></div>
            </div>
            <div id="chatMessages">
                <div class="empty-chat">
                    <i class="fas fa-inbox"></i>
                    <p>Koi chat select nahi ki gayi hai.</p>
                </div>
            </div>
            <div class="chat-input-box" style="display: none;" id="chatInputArea">
                <input type="text" id="adminMsgInput" placeholder="Type a message (Emojis supported)..." autocomplete="off">
                <button id="adminSendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>

<!-- Firebase Modular SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, serverTimestamp, update, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBUPIULkKxZx0d7sX6kag2Fa-nmkgjnDA8",
        authDomain: "livesupports-65142.firebaseapp.com",
        databaseURL: "https://livesupports-65142-default-rtdb.firebaseio.com",
        projectId: "livesupports-65142",
        storageBucket: "livesupports-65142.firebasestorage.app",
        messagingSenderId: "697418784895",
        appId: "1:697418784895:web:c1f21e30d218a1cb3f9f4a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let currentKey = null;
    let typingTimer;

    const ADMIN_PASSWORD = "Ankush@2026";
    
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => m=='&'?'&amp;':m=='<'?'&lt;':'&gt;'); }

    document.getElementById("adminLoginBtn").addEventListener("click", tryLogin);
    document.getElementById("adminPassInput").addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
    document.getElementById("logoutBtn").addEventListener("click", () => { location.reload(); });

    function tryLogin() {
        if (document.getElementById("adminPassInput").value === ADMIN_PASSWORD) {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("dashboard").style.display = "flex";
            loadKeys(); 
        } else {
            document.getElementById("loginErrorMsg").style.display = "block";
        }
    }

    document.getElementById("generateKeyBtn").addEventListener("click", () => {
        let newKey = Math.floor(100000 + Math.random() * 900000).toString();
        set(ref(db, 'support_keys/' + newKey), {
            createdAt: serverTimestamp(),
            status: 'active',
            admin_status: 'offline',
            student_status: 'offline',
            admin_typing: false,
            student_typing: false
        }).then(() => {
            alert(`New Key Generated: ${newKey}`);
        });
    });

    function loadKeys() {
        onValue(ref(db, 'support_keys'), (snapshot) => {
            const keysList = document.getElementById("keysList");
            keysList.innerHTML = "";
            const data = snapshot.val();
            
            if (data) {
                Object.keys(data).reverse().forEach(key => {
                    let div = document.createElement("div");
                    div.className = `key-item ${currentKey === key ? 'active' : ''}`;
                    let statusDot = data[key].student_status === 'online' ? '<span style="color:#25D366; font-size:0.6rem; margin-left:5px;">🟢</span>' : '';
                    div.innerHTML = `<i class="fas fa-hashtag"></i> ${key} ${statusDot}`;
                    div.onclick = () => openChat(key);
                    keysList.appendChild(div);
                });
            } else {
                keysList.innerHTML = `<p style="text-align:center; color:#94a3b8; margin-top:20px;">No keys generated yet.</p>`;
            }
        });
    }

    function openChat(key) {
        if(currentKey) {
            update(ref(db, 'support_keys/' + currentKey), { admin_status: 'offline', admin_typing: false });
        }

        currentKey = key;
        document.querySelector(".chat-header-title").innerHTML = `<span><i class="fas fa-hashtag"></i> Key: ${key}</span>`;
        document.getElementById("chatInputArea").style.display = "flex";
        document.getElementById("adminMsgInput").focus();
        
        document.querySelectorAll(".key-item").forEach(el => el.classList.remove("active"));
        if(event) event.currentTarget.classList.add("active");

        const msgBox = document.getElementById("chatMessages");
        const statusBox = document.getElementById("studentStatus");

        const myKeyRef = ref(db, 'support_keys/' + currentKey);
        update(myKeyRef, { admin_status: 'online' });
        onDisconnect(myKeyRef).update({ admin_status: 'offline', admin_typing: false });

        // Listen for Realtime messages & Mark Read
        onValue(ref(db, 'messages/' + key), (snapshot) => {
            msgBox.innerHTML = "";
            const msgs = snapshot.val();
            if(msgs) {
                Object.keys(msgs).forEach(msgId => {
                    let m = msgs[msgId];
                    
                    // Mark student message as read since admin has opened chat
                    if(m.sender === 'student' && m.status !== 'read') {
                        update(ref(db, `messages/${key}/${msgId}`), { status: 'read' });
                    }

                    let time = new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    let isAdmin = m.sender === 'admin';
                    
                    // Read Receipts Logic
                    let tickHtml = '';
                    if (isAdmin) {
                        if (m.status === 'read') {
                            tickHtml = '<i class="fas fa-check-double" style="color: #34b7f1; font-size: 0.75rem;"></i>'; // Blue Double Tick
                        } else {
                            tickHtml = '<i class="fas fa-check" style="color: #cbd5e1; font-size: 0.75rem;"></i>'; // Single Grey Tick
                        }
                    }

                    msgBox.innerHTML += `<div class="msg ${isAdmin ? 'msg-admin' : 'msg-student'}">${escapeHtml(m.text)}<span class="msg-time">${time} ${tickHtml}</span></div>`;
                });
                msgBox.scrollTop = msgBox.scrollHeight;
            } else {
                 msgBox.innerHTML = `<div class="empty-chat"><p>Abhi tak koi message nahi aaya.</p></div>`;
            }
        });

        // Listen for Student Presence & Typing
        onValue(ref(db, 'support_keys/' + key), (snapshot) => {
            const data = snapshot.val();
            if(data) {
                if(data.student_typing) {
                    statusBox.innerHTML = `<span class="status-typing">Student is typing... ✍️</span>`;
                } else if(data.student_status === 'online') {
                    statusBox.innerHTML = `<span class="status-online">Student is Online 🟢</span>`;
                } else {
                    statusBox.innerHTML = `<span class="status-offline">Student is Offline 🔴</span>`;
                }
            }
        });
    }

    function sendMessage() {
        let input = document.getElementById("adminMsgInput");
        let text = input.value.trim();
        if (text !== "" && currentKey) {
            push(ref(db, 'messages/' + currentKey), { 
                sender: 'admin', 
                text: text, 
                timestamp: Date.now(),
                status: 'sent' // Default sent status
            });
            input.value = "";
            update(ref(db, 'support_keys/' + currentKey), { admin_typing: false });
        }
    }

    document.getElementById("adminSendBtn").addEventListener("click", sendMessage);
    document.getElementById("adminMsgInput").addEventListener("keydown", (e) => { 
        if (e.key === "Enter") sendMessage(); 
    });

    document.getElementById("adminMsgInput").addEventListener("input", () => {
        if(currentKey) {
            update(ref(db, 'support_keys/' + currentKey), { admin_typing: true });
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                update(ref(db, 'support_keys/' + currentKey), { admin_typing: false });
            }, 1500);
        }
    });
</script>
</body>
</html>
